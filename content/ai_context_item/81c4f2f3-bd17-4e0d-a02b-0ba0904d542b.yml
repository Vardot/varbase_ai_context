      value: 'Varbase Brand & Identity Guidelines'
  description:
    -
      value: 'Core brand identity, terminology, and positioning guidelines for Varbase 11 — the enterprise Drupal distribution built on Drupal 11.'
  purpose:
    -
      value: 'Ensure all AI-generated content, page copy, and editorial assistance uses correct Varbase terminology, tone of voice, and brand positioning. Prevents AI from using generic Drupal language when Varbase-specific terms are more accurate.'
  content:
    -
      value: "## Varbase 11 — Brand Identity Context\r\n\r\n**Product Name**: Varbase (not \"varbase\" or \"VARBASE\")\r\n**Version**: Varbase 11 built on Drupal 11\r\n**Vendor**: Vardot — enterprise open-source Drupal specialists\r\n\r\n### Tone & Voice\r\n\r\n* Professional, enterprise-grade, developer-friendly\r\n* Use \"powerful\", \"flexible\", \"enterprise-ready\" — NOT \"simple\" or \"easy\"\r\n* Target audience: CTOs, lead developers, digital agencies\r\n\r\n### Key Terminology\r\n\r\n* \"Varbase Distribution\" (not \"Varbase theme\" or \"Varbase plugin\")\r\n* \"Vartheme BS5\" \\= the default Bootstrap 5 theme\r\n* \"Varbase Components\" \\= reusable layout building blocks\r\n* \"Varbase Media\" \\= media handling framework\r\n* \"Varbase Editor\" \\= the CKEditor 5 editorial experience\r\n* \"Vardot\" \\= the company behind Varbase\r\n\r\n### Content Rules\r\n\r\n* Always capitalize \"Varbase\", \"Drupal\", \"Bootstrap\", \"CKEditor\"\r\n* Do NOT say \"out of the box\" — say \"included by default\"\r\n* Do NOT say \"easy to use\" — say \"intuitive editorial experience\"\r\n* Reference Varbase documentation at: [https://docs.varbase.vardot.com](https://docs.varbase.vardot.com)\r\n\r\n### Site Context\r\n\r\n* Built on Varbase 11 (Drupal 11)\r\n* AI features powered by the Drupal AI module"
